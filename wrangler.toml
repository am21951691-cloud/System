name = "medical-complex-system"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Pages / Workers configuration
# For Next.js on Cloudflare Pages
pages_build_output_dir = ".next"

[vars]
NODE_ENV = "production"

# Sensitive variables (JWT_SECRET, DATABASE_URL) should be configured in
# Cloudflare Dashboard > Workers & Pages > Settings > Variables and Secrets
# Or via: wrangler secret put JWT_SECRET
